services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anticlone
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: anticlone_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - anticlone-test-data:/var/lib/postgresql/data
volumes:
  anticlone-test-data:
