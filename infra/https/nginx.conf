worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  limit_req_zone $binary_remote_addr zone=client:1m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=connections:1m;
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # PUBLIC_GATEWAY_HOST is substituted by the operator preflight, never by a request.
    if ($host != "PUBLIC_GATEWAY_HOST") { return 421; }
    if ($http_host != "PUBLIC_GATEWAY_HOST") { return 421; }
    client_max_body_size 2k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 5s;
    limit_conn connections 10;
    limit_conn_status 429;
    limit_req zone=client burst=20 nodelay;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location ~ ^/(runtime\.js|core\.js|fallback\.js|canary/(html|css)\.gif|observe(/fallback)?|entry-decision|cta-refresh|healthz)$ {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host PUBLIC_GATEWAY_HOST;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Real-IP "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_hide_header X-Powered-By;
    }
    location / { return 404; }
  }
}
