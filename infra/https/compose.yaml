# Linux VPS only: host networking keeps Node and administration on loopback.
# Only TLS is public; database is loopback. Administration is a separate private process.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anticlone
      POSTGRES_DB: anticlone
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    ports: ['127.0.0.1:54332:5432']
    volumes:
      - pilot_data:/var/lib/postgresql/data
      # Fresh pilot database only; existing volumes do not rerun initialization.
      - ../:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U anticlone -d anticlone']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}
  gateway:
    image: ${GATEWAY_IMAGE:?set immutable gateway image tag}
    network_mode: host
    depends_on:
      postgres: {condition: service_healthy}
    env_file: ${GATEWAY_ENV_FILE:?set absolute private env path}
    environment:
      GATEWAY_MODE: PILOT_OBSERVE
      GATEWAY_TRANSPORT: HTTPS_PROXY
      PORT: '3000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}
  proxy:
    image: nginx:1.28-alpine
    network_mode: host
    volumes:
      - ${NGINX_CONFIG:?set rendered config path}:/etc/nginx/nginx.conf:ro
      - ${TLS_DIRECTORY:?set private certificate directory}:/run/tls:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 32
    logging:
      driver: local
      options: {max-size: 5m, max-file: '2'}
volumes:
  pilot_data:
secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?set absolute private database password file}
