# HTTP context only. Include once; never paste in a Proxy Host/server/location.
# Only this hostname gets a key. Other hosts neither consume these zones nor change behavior.
map $host $anticlone_personal_client_key {
  default "";
  PUBLIC_GATEWAY_HOST $binary_remote_addr;
}
limit_req_zone $anticlone_personal_client_key zone=anticlone_personal_requests:1m rate=2r/s;
limit_conn_zone $anticlone_personal_client_key zone=anticlone_personal_connections:1m;
