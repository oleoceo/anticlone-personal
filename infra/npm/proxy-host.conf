# Server context, only in the AntiClone Proxy Host's Advanced configuration.
if ($host != "PUBLIC_GATEWAY_HOST") { return 421; }
if ($http_host != "PUBLIC_GATEWAY_HOST") { return 421; }
if ($scheme != https) { return 400; }
# Host-wide admission also covers NPM's generated fallback before proxy/TLS upstream.
limit_req zone=anticlone_personal_requests burst=20 nodelay;
limit_req_status 429;
limit_req_dry_run off;
limit_conn anticlone_personal_connections 10;
limit_conn_status 429;
limit_conn_dry_run off;
client_max_body_size 2k;
client_body_timeout 5s;
client_header_timeout 5s;
keepalive_timeout 10s;
send_timeout 5s;
add_header X-Content-Type-Options nosniff always;
add_header Strict-Transport-Security "max-age=86400" always;
# Preserve the existing public smoke's closed administrative entry points.
location = /admin { return 404; }
location = /login { return 404; }
