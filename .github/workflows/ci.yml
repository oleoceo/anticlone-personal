name: AntiClone checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate-repo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anticlone
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: anticlone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anticlone -d anticlone_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://anticlone:test-only@localhost:5432/anticlone_test
      HTTPS_GATE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Select PostgreSQL 16 recovery tools matching the database
        run: |
          mkdir -p "$RUNNER_TEMP/anticlone-pg16-bin"
          for tool in pg_dump pg_restore; do
            ln -s "$GITHUB_WORKSPACE/scripts/ci-postgres-tool.sh" "$RUNNER_TEMP/anticlone-pg16-bin/$tool"
          done
          echo "$RUNNER_TEMP/anticlone-pg16-bin" >> "$GITHUB_PATH"
      - name: Verify real PostgreSQL recovery tools
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -Eq ' 16[.]'
          pg_restore --version | grep -Eq ' 16[.]'
      - run: npx playwright install chromium
      - name: Smoke real Chromium before integration tests
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.setContent('<button onclick="this.textContent=\'clicked\'">ready</button>');
            await page.getByRole('button', { name: 'ready' }).click();
            assert.equal(await page.getByRole('button').textContent(), 'clicked');
            console.log('Real Chromium smoke passed:', browser.version());
          } finally {
            await browser.close();
          }
          JS
      - run: docker pull nginx:1.28-alpine
      - run: echo '127.0.0.1 gateway.test' | sudo tee -a /etc/hosts
      - run: docker build -f infra/https/Dockerfile -t anticlone-pilot:test .
      - run: docker build -f infra/npm/ssh-test.Dockerfile -t anticlone-ssh:test .
      - run: docker build -f infra/verifier/Dockerfile -t anticlone-verifier:test .
      - run: docker compose -f infra/https/compose.yaml config --quiet
        env:
          GATEWAY_IMAGE: anticlone-pilot:test
          GATEWAY_ENV_FILE: /dev/null
          DATABASE_PASSWORD_FILE: /dev/null
          NGINX_CONFIG: /tmp/nginx.conf
          TLS_DIRECTORY: /tmp/tls
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
