name: AntiClone checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate-repo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anticlone
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: anticlone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anticlone -d anticlone_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://anticlone:test-only@localhost:5432/anticlone_test
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
