name: AntiClone checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate-repo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anticlone
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: anticlone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anticlone -d anticlone_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://anticlone:test-only@localhost:5432/anticlone_test
      HTTPS_GATE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker pull nginx:1.28-alpine
      - run: echo '127.0.0.1 gateway.test' | sudo tee -a /etc/hosts
      - run: docker build -f infra/https/Dockerfile -t anticlone-pilot:test .
      - run: docker compose -f infra/https/compose.yaml config --quiet
        env:
          GATEWAY_IMAGE: anticlone-pilot:test
          GATEWAY_ENV_FILE: /dev/null
          DATABASE_PASSWORD_FILE: /dev/null
          NGINX_CONFIG: /tmp/nginx.conf
          TLS_DIRECTORY: /tmp/tls
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
