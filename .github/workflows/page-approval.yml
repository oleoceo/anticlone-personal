name: Page policy approval
on:
  pull_request:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anticlone
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: anticlone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anticlone -d anticlone_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://anticlone:test-only@localhost:5432/anticlone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test --test-concurrency=1 dist/tests/pages-admin.test.js dist/tests/scoped-gateway.test.js dist/tests/multiple-cta-surfaces.test.js
