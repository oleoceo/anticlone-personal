# Test-only NPM envelope. No traffic limits here: all controls come from infra/npm.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  server_tokens off;
  log_format synthetic_chain '$remote_addr $limit_req_status $limit_conn_status $upstream_status';
  access_log /tmp/chain.log synthetic_chain;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  include /run/tls/http-limits.conf;
  server {
    listen NPM_TEST_PORT ssl default_server;
    server_name gateway.test;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Synthetic Cloudflare peer only; production requires the verified official CIDRs.
    set_real_ip_from 127.0.0.2;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    include /run/tls/proxy-host.conf;
    include /run/tls/proxy-location.conf;
    # Representative generated NPM fallback: HTTPS upstream, no client credential.
    # Host admission must protect this path before any upstream connection/TLS attempt.
    location / { proxy_pass https://NPM_TEST_UPSTREAM; }
  }
  NPM_TEST_OTHER_SERVER
}
